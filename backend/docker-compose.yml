# Single-node MongoDB replica set for local development.
# A replica set is REQUIRED so multi-document transactions and change streams
# work — a bare `mongod` (without --replSet) fails those operations.
#
# This uses host networking on port 27018 so the advertised member host
# (`localhost:27018`) resolves from the host without a container-name mapping.
#
# Usage:
#   docker compose up -d mongo
#   docker compose exec mongo mongosh --quiet --port 27018 --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27018'}]})"
# Then set MONGO_URI in backend/.env:
#   MONGO_URI=mongodb://localhost:27018/transport_tracking
services:
  mongo:
    image: mongo:7
    container_name: ptt-mongo
    network_mode: host
    command: ["mongod", "--replSet", "rs0", "--port", "27018", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
