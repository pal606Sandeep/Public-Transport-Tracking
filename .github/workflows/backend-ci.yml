name: backend-ci

on:
  push:
    branches: [main, dev-shubh, devabhi]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27018:27018
        options: >-
          --health-cmd "mongosh --quiet --port 27018 --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
          --replSet rs0
          --bind_ip_all
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -p 6379 ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      MONGO_URI: mongodb://localhost:27018/transport_tracking?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-please-change
      NODE_ENV: test
      CORS_ORIGIN: "*"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint (build)
        # `tsc --noEmit` covers type-level issues; this build step catches
        # additional surface errors (missing exports, type-only usage, etc.)
        run: npm run build --if-present

      - name: Initialise replica set
        run: |
          sleep 2
          mongosh --quiet --port 27018 --eval 'try { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27018"}]}) } catch (e) { if (!String(e).includes("already initialized")) throw e }'
        continue-on-error: true

      - name: Run tests
        run: npm test

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: ptt-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Run migrations against preview environment
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev-shubh')
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Apply migrate-mongo up
        env:
          MONGO_URI: ${{ secrets.PREVIEW_MONGO_URI }}
        run: npx migrate-mongo up --file migrate-mongo-config.js
        continue-on-error: false